name: Deploy via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP (lftp)
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            open -u ${{ secrets.USER }},${{ secrets.PASS }} ${{ secrets.HOST }};
            mirror --reverse --delete --verbose --exclude .git --exclude .github --exclude README.md ./ /;
          "
